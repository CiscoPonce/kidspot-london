name: Discovery Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (read stale list only; no venue API calls or DB writes)'
        type: boolean
        default: false
      limit:
        description: 'Max venues to process'
        type: number
        default: 50

permissions:
  contents: read
  issues: write

concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=50" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate environment
        env:
          INGEST_SIGNING_SECRET: ${{ secrets.INGEST_SIGNING_SECRET }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          : "${INGEST_SIGNING_SECRET:?missing INGEST_SIGNING_SECRET secret}"
          : "${API_URL:?missing API_URL variable}"
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::API_URL must use https (got: $API_URL)"; exit 1 ;;
          esac

      - name: Trigger ingestion
        id: ingest
        env:
          INGEST_SIGNING_SECRET: ${{ secrets.INGEST_SIGNING_SECRET }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          LIMIT="${{ steps.params.outputs.limit }}"
          DRY_RUN="${{ steps.params.outputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then DR_JSON=true; else DR_JSON=false; fi
          BODY=$(printf '%s' "{\"limit\":${LIMIT},\"dry_run\":${DR_JSON}}")
          TS=$(date -u +%s)
          PAYLOAD="${TS}.${BODY}"
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$INGEST_SIGNING_SECRET" -r | awk '{print $1}')

          RESP_FILE="${RUNNER_TEMP}/ingest.json"
          START=$(date +%s)
          HTTP_STATUS=$(curl -sS \
            --retry 5 --retry-all-errors --retry-delay 20 \
            --connect-timeout 10 --max-time 900 \
            -o "$RESP_FILE" -w "%{http_code}" \
            -X POST "${API_URL%/}/api/admin/ingest/stale" \
            -H "x-ingest-timestamp: ${TS}" \
            -H "x-ingest-signature: sha256=${SIG}" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          END=$(date +%s)
          {
            echo "duration=$((END-START))"
            echo "http_status=$HTTP_STATUS"
            echo "resp_file=$RESP_FILE"
          } >> "$GITHUB_OUTPUT"

          echo "--- Response (HTTP $HTTP_STATUS) ---"
          cat "$RESP_FILE" || true

          if [ "$HTTP_STATUS" -ne 200 ]; then
            exit 1
          fi

      - name: Write step summary
        if: always()
        env:
          RESP_FILE: ${{ steps.ingest.outputs.resp_file }}
          HTTP_STATUS: ${{ steps.ingest.outputs.http_status }}
          DURATION: ${{ steps.ingest.outputs.duration }}
        run: |
          set +e
          {
            echo "## Discovery pipeline"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Limit | \`${{ steps.params.outputs.limit }}\` |"
            echo "| Dry run | \`${{ steps.params.outputs.dry_run }}\` |"
            echo "| HTTP | \`${HTTP_STATUS:-n/a}\` |"
            echo "| Wall time (workflow) | \`${DURATION:-n/a}s\` |"
            echo ""
            if [ -n "${RESP_FILE:-}" ] && [ -s "$RESP_FILE" ]; then
              echo "### API response"
              echo ""
              if command -v jq >/dev/null 2>&1; then
                echo "| Metric | Value |"
                echo "|---|---|"
                for key in job_id processed updated deactivated failed skipped duration_ms dry_run; do
                  val=$(jq -r "(.$key // \"—\") | tostring" "$RESP_FILE" 2>/dev/null)
                  if [ -z "$val" ]; then val="—"; fi
                  echo "| $key | \`$val\` |"
                done
                echo ""
                echo "**sources**"
                echo ""
                echo '```json'
                jq -c '.sources // {}' "$RESP_FILE" 2>/dev/null || echo '{}'
                echo '```'
              else
                echo '```json'
                cat "$RESP_FILE"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Discovery pipeline failed (${new Date().toISOString().slice(0, 10)})`;
            const body = `Scheduled run failed.

            Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
