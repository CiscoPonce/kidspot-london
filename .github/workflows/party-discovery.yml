name: Party Venue Discovery Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch data but do not write to DB)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: party-discovery-pipeline
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        env:
          INGEST_SIGNING_SECRET: ${{ secrets.INGEST_SIGNING_SECRET }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          : "${INGEST_SIGNING_SECRET:?missing INGEST_SIGNING_SECRET secret}"
          : "${API_URL:?missing API_URL variable}"
          case "$API_URL" in
            https://*) ;;
            http://*) echo "::notice::API_URL uses http — OK for dev/IP; prefer https in production." ;;
            *) echo "::error::API_URL must start with http:// or https:// (got: $API_URL)"; exit 1 ;;
          esac

      - name: Trigger ingestion
        id: ingest
        env:
          INGEST_SIGNING_SECRET: ${{ secrets.INGEST_SIGNING_SECRET }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}"
          BODY=$(printf '%s' "{\"dry_run\":${DRY_RUN}}")
          TS=$(date -u +%s)
          PAYLOAD="${TS}.${BODY}"
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$INGEST_SIGNING_SECRET" -r | awk '{print $1}')

          HTTP_STATUS=$(curl -sS \
            --retry 5 --retry-all-errors --retry-delay 20 \
            --connect-timeout 10 --max-time 900 \
            -w "%{http_code}" \
            -X POST "${API_URL%/}/api/admin/ingest/parties" \
            -H "x-ingest-timestamp: ${TS}" \
            -H "x-ingest-signature: sha256=${SIG}" \
            -H "Content-Type: application/json" \
            --data "$BODY")

          echo "--- Response (HTTP $HTTP_STATUS) ---"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            exit 1
          fi

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Party Venue Discovery failed (${new Date().toISOString().slice(0, 10)})`;
            const body = `Scheduled run failed.
            
            Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
