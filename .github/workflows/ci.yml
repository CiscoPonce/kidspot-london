name: KidSpot CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Backend Lint & Typecheck
      run: |
        cd backend
        npm run lint
        npm run typecheck

    - name: Backend Tests
      run: |
        cd backend
        PGPASSWORD=pass psql -h localhost -U user -d db -f db/schema.sql
        for file in db/migrations/*.sql; do PGPASSWORD=pass psql -h localhost -U user -d db -f "$file"; done
        NODE_ENV=test npm test
      env:
        DATABASE_URL: postgres://user:pass@localhost:5432/db
        REDIS_URL: redis://localhost:6379
        ADMIN_KEY: test_key

    - name: AI Extraction Benchmark
      run: |
        cd backend
        npm run eval:party


    - name: Frontend Lint & Build
      run: |
        cd frontend
        npm run lint
        npm run build

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kidspot-backend:latest

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kidspot-frontend:latest
